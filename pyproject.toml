[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teamguy"
version = "0.1.0"
description = "Every team has a guy. Summon yours: TheSIMGuy, TheInfraGuy, TheYourTeamGuy."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
teamguy = "teamguy.cli:main"

[tool.setuptools]
packages = ["teamguy"]

[tool.setuptools.package-data]
teamguy = ["templates/*.yaml"]
