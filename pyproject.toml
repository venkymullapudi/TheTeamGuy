[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teamguy"
version = "0.1.0"
description = "Every team has a guy. Summon yours: TheSIMGuy, TheInfraGuy, TheYourTeamGuy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
claude = ["anthropic>=1.0; python_version >= '3.10'"]
dev = ["pytest>=7"]

[project.scripts]
teamguy = "teamguy.cli:main"

[tool.setuptools.packages.find]
include = ["teamguy*"]

[tool.setuptools.package-data]
teamguy = ["templates/*.yaml"]
