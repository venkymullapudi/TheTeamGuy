name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
        env:
          TEAMGUY_BRAIN: offline
      - name: Summon TheSIMGuy
        env:
          TEAMGUY_BRAIN: offline
        run: |
          teamguy validate
          teamguy today
          teamguy card
          teamguy onboard
          teamguy work "triage the open tickets"
          teamguy level
